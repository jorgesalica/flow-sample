name: CI

# Light gate for a personal project: build, repository contracts, static checks, and
# ratcheted package coverage on pushes to main and PRs. No deploy / CD.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: typecheck/check resolve workspace deps against compiled dist.
      - run: pnpm build

      - run: pnpm check:docs
      - run: pnpm check:architecture
      - run: pnpm test:tooling
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test:coverage
